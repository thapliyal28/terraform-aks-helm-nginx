replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: stable

service:
  type: ClusterIP
  port: 80
autoscaling:
  enabled: false
  minReplicas: 1
ingress:
  enabled: true
  className: nginx
  annotations: 
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: myapp.com
      paths:
       - path: /
         pathType: Prefix
  tls:
    - hosts:
        - myapp.com
      secretName: tls-secret

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}